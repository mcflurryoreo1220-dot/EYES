<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 乙安專業解析神眼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* 視覺遮罩與相機區塊 */
        .camera-container {
            position: relative;
            width: 100%;
            height: 45vh;
            background-color: #000;
            overflow: hidden;
        }
        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 影像前處理：提高對比度與灰階，利於 OCR 辨識紙本與螢幕 */
            filter: contrast(120%) grayscale(20%);
        }
        
        /* 精準對準遮罩 */
        .mask-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 掃描對焦框 */
        .focus-box {
            width: 85%;
            height: 60%;
            border: 2px solid #22c55e;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            position: relative;
            background: transparent;
            border-radius: 8px;
        }
        /* 四個角落的裝飾 */
        .focus-box::before, .focus-box::after, .focus-box .corner-bl, .focus-box .corner-br {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #4ade80;
            border-style: solid;
        }
        .focus-box::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 8px;}
        .focus-box::after { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 8px;}
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px;}
        .corner-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px;}
        
        /* 掃描動畫線 */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(34, 197, 94, 0.8);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
            top: 0;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 隱藏的 Canvas 用於擷取畫面 */
        #capture-canvas { display: none; }

        /* 解析結果卡片動畫 */
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .result-card {
            animation: slideUp 0.4s ease-out forwards;
        }

        /* 解析內容的排版 */
        .markdown-body h3 { font-size: 1.1rem; color: #fbbf24; margin-top: 1rem; margin-bottom: 0.5rem; font-weight: 600; border-bottom: 1px solid #334155; padding-bottom: 0.25rem;}
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; color: #cbd5e1; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body strong { color: #f8fafc; font-weight: 600; }
        .markdown-body .highlight-ans { background-color: rgba(34, 197, 94, 0.2); border-left: 4px solid #22c55e; padding: 0.5rem; margin-bottom: 1rem; border-radius: 0 4px 4px 0;}
    </style>
    <!-- 引入 Tesseract.js 作為前端 OCR 引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- 引入 marked.js 解析 AI 回傳的 Markdown 格式 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="flex flex-col h-screen">

    <!-- 頂部導航列 -->
    <header class="bg-slate-900 shadow-md py-3 px-4 flex justify-between items-center z-10 relative">
        <div class="flex items-center gap-2">
            <span class="text-2xl">👁️‍🗨️</span>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">乙安專業解析神眼</h1>
                <p class="text-[10px] text-slate-400">AI 學/術科深度分析引擎</p>
            </div>
        </div>
        <div id="status-badge" class="bg-yellow-500/20 text-yellow-400 text-xs px-2 py-1 rounded-full flex items-center gap-1 border border-yellow-500/30">
            <span class="relative flex h-2 w-2">

              <span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span>

    <!-- 相機與掃描區塊 -->
    <main class="flex-1 flex flex-col relative">
        <div class="camera-container">
            <video id="video-feed" autoplay playsinline muted></video>
            
            <!-- 精準對準遮罩 (ROI) -->
            <div class="mask-overlay">
                <div class="focus-box" id="focus-box">
                    <div class="corner-bl"></div>
                    <div class="corner-br"></div>
                    <div class="scan-line hidden" id="scan-line"></div>
                </div>
            </div>
            
            <!-- 隱藏的畫布，用來裁切照片 -->
            <canvas id="capture-canvas"></canvas>

            <!-- 浮動控制按鈕 -->
            <div class="absolute bottom-4 w-full flex justify-center gap-4 z-20">
                <button id="btn-scan" class="bg-blue-600 hover:bg-blue-500 text-white font-bold h-14 w-14 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.6)] flex items-center justify-center transition-transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8V6a2 2 0 012-2h3m10 0h3a2 2 0 012 2v2M3 16v2a2 2 0 002 2h3m10 0h3a2 2 0 002-2v-2M8 12a4 4 0 118 0 4 4 0 01-8 0z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 控制面板與結果顯示區 -->
        <div class="flex-1 bg-slate-800 rounded-t-2xl -mt-4 z-10 p-4 shadow-[0_-4px_10px_rgba(0,0,0,0.3)] flex flex-col h-full overflow-hidden">
            
            <!-- 雙重保險：手動輸入區 (避免反光無法掃描) -->
            <div class="mb-4">
                <label class="block text-xs text-slate-400 mb-1 ml-1">若相機反光，可直接輸入題目關鍵字或完整題目：</label>
                <div class="flex gap-2">
                    <input type="text" id="manual-input" placeholder="例如：計算失能頻率、高壓氣體..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                    <button id="btn-manual-search" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
                        分析
                    </button>
                </div>
            </div>

            <!-- 解析結果展示卡片 (可滾動) -->
            <div class="flex-1 overflow-y-auto pb-4 custom-scrollbar">
                
                <!-- 初始提示狀態 -->
                <div id="initial-state" class="h-full flex flex-col items-center justify-center text-center p-6 opacity-60">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <p class="text-slate-300 font-medium mb-1">請將題目完整對準上方綠框</p>
                    <p class="text-xs text-slate-400">支援學科選擇題與術科(計算、問答)解析</p>
                </div>

                <!-- 載入中狀態 -->
                <div id="loading-state" class="hidden h-full flex flex-col items-center justify-center">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mb-3"></div>
                    <p class="text-blue-400 font-medium animate-pulse" id="loading-text">正在擷取文字影像...</p>
                </div>

                <!-- AI 解析結果卡片 -->
                <div id="result-container" class="hidden result-card bg-slate-900 border border-slate-700 rounded-xl p-4 shadow-lg">
                    <div class="flex justify-between items-start mb-3 border-b border-slate-700 pb-2">
                        <h2 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                            </svg>
                            AI 專業解析報告
                        </h2>
                        <span id="badge-type" class="bg-slate-700 text-xs px-2 py-1 rounded text-slate-300">自動判斷</span>
                    </div>
                    
                    <!-- 辨識出的原文 -->
                    <div class="mb-4">
                        <p class="text-xs text-slate-500 mb-1">擷取/輸入之題目：</p>
                        <p id="recognized-text" class="text-sm text-slate-300 italic bg-slate-800 p-2 rounded border-l-2 border-slate-600"></p>
                    </div>

                    <!-- AI 回應內容 (Markdown) -->
                    <div id="ai-response-content" class="markdown-body text-sm">
                        <!-- AI 內容將動態插入此處 -->
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script type="module">
        // ==========================================
        // 核心模組與變數初始化
        // ==========================================
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        const btnScan = document.getElementById('btn-scan');
        const btnManual = document.getElementById('btn-manual-search');
        const manualInput = document.getElementById('manual-input');
        const scanLine = document.getElementById('scan-line');
        const statusBadge = document.getElementById('status-badge');
        
        // UI 狀態區塊
        const initialState = document.getElementById('initial-state');
        const loadingState = document.getElementById('loading-state');
        const resultContainer = document.getElementById('result-container');
        const loadingText = document.getElementById('loading-text');
        const recognizedTextEl = document.getElementById('recognized-text');
        const aiResponseContent = document.getElementById('ai-response-content');
        
        let tesseractWorker = null;

        // ==========================================
        // 1. 初始化相機模組 (優先使用高畫質後鏡頭)
        // ==========================================
        async function initCamera() {
            try {
                // 要求高解析度與後置鏡頭，並嘗試開啟連續對焦
                const constraints = {
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        advanced: [{ focusMode: "continuous" }]
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // 確保影片元數據載入後再進行後續處理
                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
            } catch (err) {
                console.error("相機存取失敗:", err);
                alert("無法開啟相機，請確認是否已授權瀏覽器使用相機權限。\n錯誤訊息: " + err.message);
                updateStatus("相機錯誤", "bg-red-500/20 text-red-400 border-red-500/30", "bg-red-500");
            }
        }

        // ==========================================
        // 2. 初始化 Tesseract OCR 引擎 (繁體中文)
        // ==========================================
        async function initOCR() {
            try {
                updateStatus("載入辨識引擎中...", "bg-yellow-500/20 text-yellow-400 border-yellow-500/30", "bg-yellow-500");
                
                tesseractWorker = await Tesseract.createWorker({
                    logger: m => {
                        // 可以解開註解查看下載進度，但會產生較多 log
                        // console.log(m); 
                    }
                });
                
                await tesseractWorker.loadLanguage('chi_tra');
                await tesseractWorker.initialize('chi_tra');
                
                // 設定 OCR 參數提升辨識率 (針對繁體中文與英文數字)
                await tesseractWorker.setParameters({
                    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
                });

                updateStatus("🟢 系統就緒", "bg-green-500/20 text-green-400 border-green-500/30", "bg-green-500", false);
                btnScan.disabled = false;
            } catch (error) {
                console.error("OCR 引擎載入失敗:", error);
                updateStatus("引擎載入失敗", "bg-red-500/20 text-red-400 border-red-500/30", "bg-red-500");
            }
        }

        // 狀態標籤更新輔助函式
        function updateStatus(text, bgClasses, dotClass, animate = true) {
            statusBadge.className = `text-xs px-2 py-1 rounded-full flex items-center gap-1 border ${bgClasses}`;
            
            let dotHtml = `<span class="relative flex h-2 w-2">`;
            if (animate) {
                dotHtml += `<span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${dotClass}"></span>`;
            }
            dotHtml += `<span class="relative inline-flex rounded-full h-2 w-2 ${dotClass}"></span></span>`;
            
            statusBadge.innerHTML = `${dotHtml} ${text}`;
        }

        // ==========================================
        // 3. 核心裁切邏輯：將綠色對準框(ROI)內的影像精準切出
        // ==========================================
        function captureROIVideo() {
            const focusBox = document.getElementById('focus-box');
            
            // 取得相機原始影像的解析度
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            // 取得網頁上 Video 元素實際顯示的大小與位置
            const videoRect = video.getBoundingClientRect();
            // 取得對準框在螢幕上的實際大小與位置
            const focusRect = focusBox.getBoundingClientRect();

            // 步驟一：計算縮放比例 (處理 object-fit: cover 造成的偏移)
            // 找出影像被放大/縮小的倍率 (以寬度或高度中，縮放倍率較大者為基準，因為是 cover)
            const scaleX = videoRect.width / videoWidth;
            const scaleY = videoRect.height / videoHeight;
            const scale = Math.max(scaleX, scaleY);

            // 計算出實際顯示的影片，被裁切掉的 x, y 偏移量
            const scaledVideoWidth = videoWidth * scale;
            const scaledVideoHeight = videoHeight * scale;
            const offsetX = (scaledVideoWidth - videoRect.width) / 2;
            const offsetY = (scaledVideoHeight - videoRect.height) / 2;

            // 步驟二：座標映射 (將螢幕上 focusBox 的座標，換算回原始相機像素座標)
            // 計算 focusBox 相對影片左上角的座標
            const relativeLeft = focusRect.left - videoRect.left;
            const relativeTop = focusRect.top - videoRect.top;

            // 反推原始像素座標
            const sourceX = (relativeLeft + offsetX) / scale;
            const sourceY = (relativeTop + offsetY) / scale;
            const sourceWidth = focusRect.width / scale;
            const sourceHeight = focusRect.height / scale;

            // 步驟三：設定 Canvas 並進行影像繪製與前處理
            canvas.width = sourceWidth;
            canvas.height = sourceHeight;

            // 繪製裁切區塊
            ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

            // --- 影像前處理強化 (二值化/高對比)，提升 OCR 準確率 ---
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                // 轉換為灰階
                let brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
                // 增加對比 (簡單的閾值處理，讓黑白更分明)
                let contrast = 120; // 調整對比度數值
                let factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
                let color = factor * (brightness - 128) + 128;
                
                // 限制範圍在 0-255
                color = Math.max(0, Math.min(255, color));
                
                data[i] = color;     // Red
                data[i + 1] = color; // Green
                data[i + 2] = color; // Blue
            }
            ctx.putImageData(imageData, 0, 0);

            // 回傳 Base64 格式影像供 Tesseract 辨識
            return canvas.toDataURL('image/jpeg', 0.9);
        }

        // ==========================================
        // 4. Gemini AI 解析引擎串接
        // ==========================================
        async function analyzeWithGemini(questionText) {
            // 建立專家級 System Prompt，定義其角色為「乙安考前衝刺導師」
            const systemPrompt = `你是一位「台灣乙級職業安全衛生管理員 (乙安)」的王牌講師與考前衝刺導師。
你的任務是針對使用者提供的考試題目（可能是學科選擇題，也可能是術科計算、問答題），提供最專業、深入且精準的解析。

請務必嚴格遵循以下輸出格式與原則：

1. **判斷題型**：
   - 若題目帶有選項 (如 ①②③④ 或 ABCD)，視為【學科測驗】。
   - 若無選項，且涉及計算、法規列舉、名詞解釋，視為【術科測驗】。

2. **學科測驗輸出格式**：
   <div class="highlight-ans">🎯 正確解答：(請填寫正確選項數字或文字)</div>
   ### 📖 法規依據
   (直接引述《職業安全衛生法》、《設施規則》等相關條文重點)
   ### 💡 深度解析
   (詳細解釋正確的原因。並且「必須」逐一解釋其他錯誤選項為何錯誤，這是學科拿高分的關鍵。例如：選項(2)錯誤，應為 2 公尺而非 1.5 公尺)

3. **術科測驗輸出格式 (含計算題)**：
   <div class="highlight-ans">🎯 術科解題重點</div>
   ### 📐 解題公式 / 法規條列
   (若是計算題，先列出完整的標準公式，如 FR = 失能傷害人次 / 總經歷工時 × 1,000,000。若是問答題，請使用條列式重點條列法規項目)
   ### 📝 逐步推導與專家提點
   (計算題請展現代入數字的過程。並針對此題型給予「考試常考陷阱」提點，例如：計算 FR 時死亡算 6000 日損失)

4. **語氣**：專業、鼓勵、條理分明。使用 Markdown 格式排版 (粗體、清單)。`;

            // 設定 Gemini API 端點與參數 (使用 flash 模型求快)
            const apiKey = ""; // Canvas 環境會自動代入
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: `請解析這道乙安考題：\n"${questionText}"` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                // 可考慮加入 search grounding 確保法規最新，但為求速度此處先依賴模型內建知識
                // tools: [{ "google_search": {} }], 
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API 錯誤: ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    return candidate.content.parts[0].text;
                } else {
                    return "AI 暫時無法解析此題目，請檢查題目是否清晰完整。";
                }
            } catch (error) {
                console.error("Gemini AI 請求失敗:", error);
                throw error;
            }
        }

        // ==========================================
        // 5. 流程控制：掃描 -> OCR -> AI 解析 -> UI 呈現
        // ==========================================
        async function processScan() {
            if (!tesseractWorker) {
                alert("辨識引擎仍在載入中，請稍候。");
                return;
            }

            // UI 狀態切換
            btnScan.disabled = true;
            scanLine.classList.remove('hidden');
            initialState.classList.add('hidden');
            resultContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');
            
            try {
                // 階段 1：擷取並處理影像
                loadingText.textContent = "1/3 擷取影像與強化處理中...";
                const imageDataUrl = captureROIVideo();

                // 階段 2：執行 OCR 辨識
                loadingText.textContent = "2/3 AI 辨識文字中...";
                const { data: { text } } = await tesseractWorker.recognize(imageDataUrl);
                
                // 清理辨識結果 (移除多餘空白與換行)
                const cleanText = text.replace(/\s+/g, ' ').trim();
                
                if (cleanText.length < 5) {
                    throw new Error("擷取到的文字過少，請將鏡頭靠近或避開反光。");
                }

                recognizedTextEl.textContent = cleanText;

                // 階段 3：送交 Gemini AI 進行專業解析
                loadingText.textContent = "3/3 導師級法規解析中...";
                const aiAnalysisResult = await analyzeWithGemini(cleanText);

                // 渲染結果
                renderResult(aiAnalysisResult);

            } catch (error) {
                console.error("處理過程中發生錯誤:", error);
                recognizedTextEl.textContent = "發生錯誤";
                aiResponseContent.innerHTML = `<p class="text-red-400">⚠️ ${error.message}</p>`;
                renderResult(null, true);
            } finally {
                btnScan.disabled = false;
                scanLine.classList.add('hidden');
                loadingState.classList.add('hidden');
            }
        }

        // 手動輸入處理邏輯
        async function processManual() {
            const text = manualInput.value.trim();
            if (text.length < 2) {
                alert("請至少輸入 2 個字以上的題目關鍵字");
                return;
            }
            
            // 隱藏虛擬鍵盤 (行動裝置)
            manualInput.blur();

            initialState.classList.add('hidden');
            resultContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadingText.textContent = "AI 專業法規解析中...";
            recognizedTextEl.textContent = text;

            try {
                const aiAnalysisResult = await analyzeWithGemini(text);
                renderResult(aiAnalysisResult);
            } catch (error) {
                aiResponseContent.innerHTML = `<p class="text-red-400">⚠️ 網路或 AI 服務異常，請稍後再試。</p>`;
                renderResult(null, true);
            } finally {
                loadingState.classList.add('hidden');
            }
        }

        // 渲染 Markdown 結果到 UI
        function renderResult(markdownText, isError = false) {
            resultContainer.classList.remove('hidden');
            if (!isError && markdownText) {
                // 使用 marked.js 將 Markdown 轉為 HTML
                aiResponseContent.innerHTML = marked.parse(markdownText);
            }
        }

        // ==========================================
        // 綁定事件與啟動
        // ==========================================
        btnScan.addEventListener('click', processScan);
        btnManual.addEventListener('click', processManual);
        manualInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processManual();
        });

        // 啟動程式
        window.addEventListener('DOMContentLoaded', async () => {
            btnScan.disabled = true; // 引擎載入前禁用掃描
            await initCamera();
            await initOCR();
        });

    </script>
</body>
</html>
