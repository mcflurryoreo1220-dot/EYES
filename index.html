            let parts = line.split('|').map(p => p.trim());
            if (parts.length >= 4) {
                let id = parts[1];
                let text = parts[2];
                let ans = parts[3];
                // 過濾掉空行，確保這是一行題目

        // 文字正規化：移除標點符號與空白，以便模糊比對
        function cleanText(str) {
            return str.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
        }

        // 取 N-gram (兩個字元一組) 以提升模糊比對容錯率 (對付 OCR 錯字)
        function getBigrams(str) {
            let cleaned = cleanText(str);
            let grams = new Set();
            for (let i = 0; i < cleaned.length - 1; i++) {
                grams.add(cleaned.substring(i, i + 2));
            }
            return grams;
        }

        // 核心模糊比對演算法
        function findBestMatch(ocrText) {
            if (!ocrText || ocrText.length < 3) return null;
            let ocrGrams = getBigrams(ocrText);
            if (ocrGrams.size === 0) return null;

            let bestMatch = null;
            let maxOverlap = 0;

            for (let item of qnaDB) {
                let dbGrams = getBigrams(item.text);
                let overlapCount = 0;
                for (let gram of ocrGrams) {
                    if (dbGrams.has(gram)) overlapCount++;
                }
                
                // 計算重疊比例，如果 OCR 抓到一句話，只要在題庫中重疊度夠高就認定
                if (overlapCount > maxOverlap && overlapCount > 3) {
                    maxOverlap = overlapCount;
                    bestMatch = item;
                }
            }

            // 換算成百分比，取決於 OCR 文字長度與重疊度 (上限 99%)
            let score = Math.min(99, Math.round((maxOverlap / ocrGrams.size) * 100));
            return bestMatch ? { item: bestMatch, score } : null;
        }

                    modalQuestion.textContent = `(題號 ${result.item.id}) ` + result.item.text;
                    modalScore.textContent = result.score;
                    document.getElementById('modal-explanation').textContent = getExplanation(result.item.text, result.item.ans);
                    
                    modal.classList.remove('hidden');
                    // 些微延遲觸發動畫
                    setTimeout(() => {
                        modal.classList.remove('opacity-0', 'scale-95');
                        modal.classList.add('opacity-100', 'scale-100');
                    }, 10);
                } else {
                    // 找不到時的小提示
                    scanBtnText.textContent = "❌ 畫面不清晰，請再試一次";
                    setTimeout(() => {
                        scanBtnText.textContent = "立即掃描解題";
                    }, 2000);
                }
            } catch (err) {
                console.error("OCR 錯誤", err);
                scanBtnText.textContent = "發生錯誤";
            } finally {
                scanBtn.disabled = false;
                scanLine.style.display = "none";
                if(scanBtnText.textContent === "掃描分析中...") {
                    scanBtnText.textContent = "立即掃描解題";
                }
            }
        });

        // 關閉彈窗
        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('opacity-100', 'scale-100');
            modal.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        });

        const manualInput = document.getElementById('manual-search');
        const searchResults = document.getElementById('search-results');

        manualInput.addEventListener('input', (e) => {
            const keyword = cleanText(e.target.value);
            if (keyword.length < 2) {
                searchResults.classList.add('hidden');
                searchResults.innerHTML = '';
                return;
            }

            searchResults.classList.remove('hidden');
            searchResults.innerHTML = '';
            
            // 全文比對
            let count = 0;
            for (let item of qnaDB) {
                if (cleanText(item.text).includes(keyword)) {
                    if(count >= 5) break; // 最多顯示 5 筆
                    
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 p-4 rounded-xl border-l-4 border-green-500 shadow-md flex flex-col gap-2";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold text-slate-400">題號 ${item.id}</span>
                            <span class="text-2xl font-black text-green-400">${item.ans.replace(/\s+/g, ' 或 ')}</span>
                        </div>
                        <p class="text-sm text-slate-200 line-clamp-2">${item.text}</p>
                        <p class="text-xs text-blue-300 mt-1 bg-blue-900/30 p-2 rounded border border-blue-800/50 leading-relaxed">
                            💡 解析：${getExplanation(item.text, item.ans)}
                        </p>
                    `;
                    searchResults.appendChild(card);
                    count++;
                }
            }

            if (count === 0) {
                searchResults.innerHTML = `<div class="text-center text-slate-500 text-sm mt-4">找不到包含此關鍵字的題目</div>`;
            }
        });

        // 啟動系統
        window.onload = initSystem;
    </script>
</body>
</html>
